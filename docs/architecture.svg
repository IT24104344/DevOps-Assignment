<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="1200" height="660" fill="#ffffff"/>
  <text x="600" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">NodeGoat: Architecture, Data Flows and Trust Boundaries</text>

  <!-- Zone 1 -->
  <rect x="30" y="70" width="250" height="400" rx="10" fill="#fdecea" stroke="#c62828" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="155" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#c62828">Zone 1: Internet / user host</text>
  <text x="155" y="118" text-anchor="middle" font-size="12" fill="#c62828">untrusted</text>
  <rect x="55" y="200" width="200" height="120" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="155" y="236" text-anchor="middle" font-size="15" font-weight="bold">User browser</text>
  <text x="155" y="258" text-anchor="middle" font-size="12">employee / admin / attacker</text>
  <text x="155" y="278" text-anchor="middle" font-size="12">HTML + jQuery pages</text>
  <text x="155" y="298" text-anchor="middle" font-size="12">holds session cookie</text>

  <!-- TB1 -->
  <line x1="315" y1="80" x2="315" y2="460" stroke="#6a1b9a" stroke-width="3"/>
  <rect x="293" y="92" width="44" height="22" rx="4" fill="#6a1b9a"/>
  <text x="315" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">TB1</text>

  <!-- Zone 2 -->
  <rect x="350" y="70" width="820" height="400" rx="10" fill="#e8f1fb" stroke="#1565c0" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="760" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565c0">Zone 2: Docker Compose private network</text>

  <rect x="400" y="140" width="320" height="260" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="560" y="170" text-anchor="middle" font-size="15" font-weight="bold">web container</text>
  <text x="560" y="190" text-anchor="middle" font-size="12">node:12-alpine, runs as "node", port 4000</text>
  <text x="420" y="222" font-size="12">Express 4 + express-session</text>
  <text x="420" y="242" font-size="12">Swig templates (app/views)</text>
  <text x="420" y="262" font-size="12">Routes: login, profile, contributions,</text>
  <text x="420" y="280" font-size="12">allocations, benefits, memos, research</text>
  <text x="420" y="302" font-size="12">DAOs (app/data) using MongoDB driver</text>
  <text x="420" y="324" font-size="12">helmet CSP + autoescape (V3 fix)</text>
  <text x="420" y="346" font-size="12">Config: config/env/all.js</text>
  <text x="420" y="366" font-size="12" fill="#c62828">(hardcoded session secret)</text>

  <!-- TB2 -->
  <line x1="790" y1="120" x2="790" y2="440" stroke="#6a1b9a" stroke-width="3"/>
  <rect x="768" y="126" width="44" height="22" rx="4" fill="#6a1b9a"/>
  <text x="790" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">TB2</text>

  <!-- Zone 3 -->
  <rect x="830" y="120" width="320" height="320" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="990" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d32">Zone 3: Data tier</text>
  <text x="990" y="164" text-anchor="middle" font-size="12" fill="#2e7d32">most trusted, not published to host</text>
  <rect x="860" y="190" width="260" height="200" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="990" y="218" text-anchor="middle" font-size="15" font-weight="bold">mongo container</text>
  <text x="990" y="238" text-anchor="middle" font-size="12">mongo:4.4, 27017 (expose only)</text>
  <text x="880" y="266" font-size="12">DB "nodegoat" collections:</text>
  <text x="880" y="286" font-size="12">users (names, passwords, SSN,</text>
  <text x="880" y="304" font-size="12">bank details), allocations,</text>
  <text x="880" y="322" font-size="12">contributions, memos, counters</text>
  <text x="880" y="350" font-size="12" fill="#c62828">No DB authentication enabled</text>

  <!-- Flows with numbered badges -->
  <line x1="255" y1="235" x2="396" y2="235" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="355" cy="235" r="12" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="355" y="240" text-anchor="middle" font-size="13" font-weight="bold">1</text>
  <line x1="396" y1="290" x2="259" y2="290" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="355" cy="290" r="12" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="355" y="295" text-anchor="middle" font-size="13" font-weight="bold">2</text>
  <line x1="720" y1="250" x2="856" y2="250" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="755" cy="250" r="12" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="755" y="255" text-anchor="middle" font-size="13" font-weight="bold">3</text>
  <line x1="856" y1="330" x2="724" y2="330" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="755" cy="330" r="12" fill="#fff" stroke="#333" stroke-width="1.5"/><text x="755" y="335" text-anchor="middle" font-size="13" font-weight="bold">4</text>

  <!-- Legend -->
  <rect x="30" y="490" width="1140" height="150" rx="8" fill="#fafafa" stroke="#bbb"/>
  <text x="50" y="516" font-size="14" font-weight="bold">Data flows</text>
  <text x="50" y="540" font-size="12">1  HTTP requests to :4000: login, signup, profile update, contributions, memos, allocations?threshold=</text>
  <text x="50" y="560" font-size="12">2  Rendered HTML pages + Set-Cookie (connect.sid session cookie)</text>
  <text x="50" y="580" font-size="12">3  MongoDB queries from the DAOs (find, update, $where for allocations)</text>
  <text x="50" y="600" font-size="12">4  Documents returned (user profiles, allocations, memos)</text>
  <text x="640" y="516" font-size="14" font-weight="bold" fill="#6a1b9a">Trust boundaries</text>
  <text x="640" y="540" font-size="12">TB1  Internet to web app: every form field and URL parameter is</text>
  <text x="640" y="558" font-size="12">untrusted (XSS, NoSQL injection and eval injection all cross here).</text>
  <text x="640" y="582" font-size="12">TB2  Web app to database: queries must not be built from raw input;</text>
  <text x="640" y="600" font-size="12">MongoDB has no auth, so the Docker network is its only protection.</text>
</svg>
