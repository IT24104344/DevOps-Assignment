<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="560" fill="#ffffff"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a2b4a">OWASP NodeGoat (RetireEasy) - DevSecOps Architecture</text>

  <!-- Trust boundary: Public internet -->
  <rect x="30" y="60" width="200" height="440" rx="10" fill="#fdf0f0" stroke="#c0392b" stroke-dasharray="6 4" stroke-width="2"/>
  <text x="130" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Trust boundary: Public Internet</text>

  <!-- User -->
  <rect x="70" y="180" width="120" height="90" rx="8" fill="#eaf2fb" stroke="#2c6cb0" stroke-width="2"/>
  <text x="130" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2b4a">End User</text>
  <text x="130" y="238" text-anchor="middle" font-size="11" fill="#33475b">Browser</text>
  <text x="130" y="255" text-anchor="middle" font-size="11" fill="#33475b">(HTTP :4000)</text>

  <!-- Trust boundary: Docker internal network -->
  <rect x="270" y="60" width="560" height="440" rx="10" fill="#eef6ff" stroke="#2c6cb0" stroke-dasharray="6 4" stroke-width="2"/>
  <text x="550" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c6cb0">Trust boundary: Docker Compose internal network</text>

  <!-- Web container -->
  <rect x="320" y="150" width="220" height="150" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="430" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b5e20">web (Component 1)</text>
  <text x="430" y="205" text-anchor="middle" font-size="12" fill="#33475b">Node.js 12 / Express</text>
  <text x="430" y="224" text-anchor="middle" font-size="12" fill="#33475b">App logic + views (Swig)</text>
  <text x="430" y="243" text-anchor="middle" font-size="12" fill="#33475b">Session / auth</text>
  <text x="430" y="268" text-anchor="middle" font-size="11" fill="#7a5c00">Container: nodegoat-web</text>
  <text x="430" y="285" text-anchor="middle" font-size="11" fill="#7a5c00">Exposes :4000</text>

  <!-- DB container -->
  <rect x="600" y="150" width="190" height="150" rx="8" fill="#fff4e5" stroke="#e67e22" stroke-width="2"/>
  <text x="695" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#a04000">mongo (Component 2)</text>
  <text x="695" y="205" text-anchor="middle" font-size="12" fill="#33475b">MongoDB 4.4</text>
  <text x="695" y="224" text-anchor="middle" font-size="12" fill="#33475b">User + allocation data</text>
  <text x="695" y="268" text-anchor="middle" font-size="11" fill="#7a5c00">Container: nodegoat-mongo</text>
  <text x="695" y="285" text-anchor="middle" font-size="11" fill="#7a5c00">Port 27017 (internal only)</text>

  <!-- CI/CD box -->
  <rect x="320" y="360" width="470" height="110" rx="8" fill="#f3e8fd" stroke="#7b3fa0" stroke-width="2"/>
  <text x="555" y="386" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b2c82">GitHub Actions CI/CD (security gates)</text>
  <text x="555" y="410" text-anchor="middle" font-size="11.5" fill="#33475b">1. Semgrep (SAST)   2. npm audit (SCA)</text>
  <text x="555" y="430" text-anchor="middle" font-size="11.5" fill="#33475b">3. Gitleaks (secrets)   4. Trivy (container - HARD GATE)</text>
  <text x="555" y="452" text-anchor="middle" font-size="11" fill="#7a5c00">Secrets via GitHub Actions encrypted secrets</text>

  <!-- Arrows -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#33475b"/></marker>
  </defs>
  <line x1="190" y1="225" x2="318" y2="225" stroke="#33475b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="255" y="216" text-anchor="middle" font-size="10" fill="#33475b">HTTP</text>
  <line x1="540" y1="225" x2="598" y2="225" stroke="#33475b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="569" y="216" text-anchor="middle" font-size="10" fill="#33475b">MongoDB</text>
  <text x="569" y="248" text-anchor="middle" font-size="10" fill="#33475b">wire :27017</text>
  <line x1="430" y1="300" x2="470" y2="358" stroke="#7b3fa0" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="500" y="335" text-anchor="middle" font-size="10" fill="#5b2c82">build/scan image</text>
</svg>
