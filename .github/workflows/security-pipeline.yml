name: DevSecOps Security Pipeline

# IE3142 DevOps Security - Group Assignment
# Builds and tests the app on every push/PR and runs four automated security gates:
#   1. SAST                      - Semgrep
#   2. Dependency / SCA          - npm audit
#   3. Secrets scanning          - Gitleaks
#   4. Container image scanning  - Trivy (HARD GATE: fails the build on HIGH/CRITICAL)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ----------------------------------------------------------------------------
  # Build + install. Establishes that the app builds on every push.
  # ----------------------------------------------------------------------------
  build:
    name: Build & Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '12'
      - name: Install dependencies
        run: npm install --no-audit --no-fund

  # ----------------------------------------------------------------------------
  # GATE 1 - SAST with Semgrep
  # ----------------------------------------------------------------------------
  sast-semgrep:
    name: "Gate 1 - SAST (Semgrep)"
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/nodejs \
            --config p/owasp-top-ten \
            --exclude scans --exclude node_modules \
            --sarif --output semgrep.sarif \
            --json --output semgrep.json \
            . || true
          echo "Semgrep findings:"; \
          grep -o '"check_id"' semgrep.json | wc -l
      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: |
            semgrep.sarif
            semgrep.json

  # ----------------------------------------------------------------------------
  # GATE 2 - Dependency / Software Composition Analysis with npm audit
  # ----------------------------------------------------------------------------
  dependency-audit:
    name: "Gate 2 - Dependency scan (npm audit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '12'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run npm audit
        run: |
          npm audit --json > npm-audit.json || true
          npm audit || true
      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json

  # ----------------------------------------------------------------------------
  # GATE 3 - Secrets scanning with Gitleaks
  # ----------------------------------------------------------------------------
  secrets-gitleaks:
    name: "Gate 3 - Secrets scan (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------------------
  # GATE 4 - Container image scanning with Trivy  (HARD GATE)
  # This gate is configured to FAIL the pipeline on HIGH/CRITICAL vulnerabilities.
  # ----------------------------------------------------------------------------
  container-trivy:
    name: "Gate 4 - Container scan (Trivy) [FAILS BUILD]"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t nodegoat-web:ci .
      - name: Trivy scan (report only, full table)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: nodegoat-web:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'
          output: trivy-report.txt
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
      - name: Trivy scan (HARD GATE - fails build on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: nodegoat-web:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'   # <-- this makes the gate BLOCK the build
